name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner baseline
        run: |
          set -euxo pipefail
          python3.12 --version
          git --version

      - name: Checkout without reusable actions
        run: |
          set -euxo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Unit tests
        run: PYTHONPATH=src python3.12 -m unittest discover -s tests -v

      - name: Python 3.12 grammar and compile
        run: |
          python3.12 - <<'PY'
          import ast
          from pathlib import Path

          files = list(Path("src").rglob("*.py")) + list(Path("tests").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 12))
          print(f"Python 3.12 grammar OK: {len(files)} files")
          PY
          python3.12 -m compileall -q src tests

      - name: CLI smoke
        run: |
          set -euxo pipefail
          db="${RUNNER_TEMP}/archotraz-state/archotraz.db"
          PYTHONPATH=src python3.12 -m archotraz init --db "$db"
          test -f "$db"

      - name: Editable package install
        run: python3.12 -m pip install -e .
