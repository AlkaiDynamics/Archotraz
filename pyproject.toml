[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "archotraz"
version = "0.1.0"
description = "Archotraz algorithmic search, falsification, and recombination engine"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
archotraz = "archotraz.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
